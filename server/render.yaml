services:
  - type: web
    name: sys-agent-receiver
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: UPLOAD_DIR
        value: /tmp/received_uploads
      - key: ADMIN_TOKEN
        generateValue: true
